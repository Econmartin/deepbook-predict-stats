# Index DeepBook Predict from the chain and publish the static site to
# GitHub Pages. The previous run's database is pulled back from the live
# site (predict.db.gz), so each run only pages new events.
#
# Cadence: GitHub's cron is best-effort and often skips frequent schedules,
# so each run queues the next one itself (workflow_dispatch is allowed from
# GITHUB_TOKEN). The concurrency group collapses duplicate chains, and the
# cron below only restarts the chain if it ever breaks.
# To pause publishing: Actions → Publish → Disable workflow.
name: Publish

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # The site's public address. Set the repo variable SITE_URL for a custom
      # domain (e.g. https://stats.example.com/); defaults to the Pages URL.
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve site address
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          url="${SITE_URL:-https://${owner}.github.io/${repo}/}"
          url="${url%/}/"
          path="/$(echo "$url" | cut -d/ -f4-)"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "BASE_PATH=${path%/}/" >> "$GITHUB_ENV"
          echo "site $url (base ${path%/}/)"

      - name: Restore previous database from the live site
        run: |
          mkdir -p data
          url="${SITE_URL}predict.db.gz"
          if curl -fsSL "$url" -o data/predict.db.gz; then
            gunzip -f data/predict.db.gz && echo "restored $(du -h data/predict.db | cut -f1) from $url"
          else
            echo "no published database yet; backfilling from the first event"
          fi

      - name: Index new chain events
        run: npm run sync

      - name: Tests
        run: npm test

      - name: Reconcile payouts against on-chain claims
        run: npm run verify

      - name: Build site
        run: |
          npm run build
          npm run export -- web/dist
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
          retention-days: 1

      - id: deploy
        uses: actions/deploy-pages@v4

  next:
    # Queue the following run ~8 minutes after this one ends, even if it failed.
    needs: publish
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sleep 480
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
